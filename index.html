<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receitas do Jhonny</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🍳 Receitas do Jhonny</h1>
        <p>Descubra receitas deliciosas e fáceis de fazer</p>
    </header>

    <main>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Busque por nome, descrição ou categoria...">
        </div>

        <section class="recipes-grid" id="recipesGrid">
            <!-- Receitas serão inseridas via JavaScript -->
        </section>

        <div id="emptyState" class="empty-state">
            <h2>Nenhum resultado encontrado</h2>
            <p>Tente procurar por algo diferente.</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Receitas do Jhonny. Feito com carinho.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
